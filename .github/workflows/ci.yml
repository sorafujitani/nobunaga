name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ruby: "3.2"
          - os: ubuntu-latest
            ruby: "3.3"
          - os: macos-latest
            ruby: "3.2"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy (extension)
        run: cargo clippy --manifest-path ext/nobunaga/Cargo.toml --locked -- -D warnings

      - name: Bundle install
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Test
        run: bundle exec rake test
